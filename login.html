<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Educação no Trânsito</title>
    <meta
      name="description"
      content="Tela de login com nome e senha para acesso ao sistema de educação no trânsito."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <div class="logo-mark">E</div>
          <div>
            <p class="mini-label" id="frenteLabel">Acesso</p>
            <h1 id="tituloFrente">Educar para Viver</h1>
          </div>
        </div>

        <form id="loginForm" class="login-form" action="#" method="post">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome" />

          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" placeholder="Digite sua senha" />

          <button type="submit" class="btn btn-primary login-btn">Entrar</button>
        </form>

        <p class="login-footer">
          Deseja trocar de frente?
          <a href="selecao-frente.html">Voltar à seleção</a>
        </p>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
